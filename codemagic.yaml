workflows:
  android-apk:
    name: MI Material Calculator APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Check Gradle
        script: gradle --version
      - name: Build debug APK
        script: gradle --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
